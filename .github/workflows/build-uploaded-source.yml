name: Build uploaded NexusOS ISO

on:
  push:
    branches:
      - main
    paths:
      - "Nexus-OS-Stage0-r3-local-repository.zip"
      - ".github/workflows/build-uploaded-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusos-uploaded-iso
  cancel-in-progress: true

jobs:
  build-and-boot-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install ISO build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git gettext po4a unzip cmake ninja-build g++ \
            live-build xorriso debootstrap squashfs-tools debian-archive-keyring \
            grub-pc-bin grub-efi-amd64-bin mtools \
            qemu-system-x86 ovmf

      - name: Install current official Debian live-build
        run: |
          git clone --depth 1 https://salsa.debian.org/live-team/live-build.git /tmp/current-live-build
          sudo make -C /tmp/current-live-build install
          lb --version

      - name: Extract canonical Stage 0 source
        run: |
          rm -rf source
          mkdir source
          unzip -q Nexus-OS-Stage0-r3-local-repository.zip -d source
          test -x source/Nexus-OS/scripts/build-iso.sh

      - name: Apply Debian 13 repository compatibility
        run: |
          sed -i 's/bookworm/trixie/g' source/Nexus-OS/distro/live-build/auto/config
          sed -i 's/quiet splash/console=ttyS0,115200n8/g' source/Nexus-OS/distro/live-build/auto/config
          sed -i 's/quiet splash/console=ttyS0,115200n8/g' source/Nexus-OS/scripts/build-iso.sh
          sed -i 's/--binary-images/--binary-image/' source/Nexus-OS/distro/live-build/auto/config
          sed -i '/--mirror-binary-security/a\  --security false \\' source/Nexus-OS/distro/live-build/auto/config
          sed -i '/--security false/a\  --apt-indices false \\' source/Nexus-OS/distro/live-build/auto/config
          sed -i '/--apt-indices false/a\  --apt-recommends false \\' source/Nexus-OS/distro/live-build/auto/config
          sed -i '/^ISO="$(find/c\ISO="$WORK/live-image-amd64.hybrid.iso"' source/Nexus-OS/scripts/build-iso.sh
          sed -i '/ISO build completed without an ISO output/d' source/Nexus-OS/scripts/build-iso.sh
          sed -i '/inspect-iso/d' source/Nexus-OS/scripts/build-iso.sh
          mkdir -p source/Nexus-OS/distro/live-build/config/includes.chroot/etc/systemd/system/multi-user.target.wants
          ln -sf ../nexus-boot-marker.service source/Nexus-OS/distro/live-build/config/includes.chroot/etc/systemd/system/multi-user.target.wants/nexus-boot-marker.service
          mkdir -p source/Nexus-OS/distro/live-build/config/archives
          printf '%s\n' 'deb http://security.debian.org/debian-security trixie-security main contrib non-free-firmware' > source/Nexus-OS/distro/live-build/config/archives/debian-security.list.chroot
          sed -i -e 's/^live-config$/live-config-systemd/' -e '/^steam-installer$/d' -e '/^gamescope$/d' source/Nexus-OS/distro/live-build/config/package-lists/nexusos.list.chroot

      - name: Validate source
        working-directory: source/Nexus-OS
        run: ./scripts/validate-release.sh

      - name: Build hybrid desktop ISO
        working-directory: source/Nexus-OS
        run: |
          sudo ./scripts/build-iso.sh desktop
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Verify checksum
        working-directory: source/Nexus-OS
        run: sha256sum -c dist/*.iso.sha256

      - name: Verify BIOS boot
        working-directory: source/Nexus-OS
        run: |
          if ! sudo env NEXUS_QEMU_TIMEOUT=240 ./scripts/test-iso-qemu.sh dist/*.iso bios; then
            sudo cat dist/*.bios.qemu.log
            exit 1
          fi

      - name: Verify UEFI boot
        working-directory: source/Nexus-OS
        run: |
          if ! sudo env NEXUS_QEMU_TIMEOUT=240 ./scripts/test-iso-qemu.sh dist/*.iso uefi; then
            sudo cat dist/*.uefi.qemu.log
            exit 1
          fi

      - name: Split Rufus-ready ISO for download
        if: always()
        working-directory: source/Nexus-OS
        run: |
          ISO="$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          split -b 390M -d -a 2 "$ISO" "$ISO.part-"
          test -f "$ISO.part-03"
          ls -lh "$ISO" "$ISO".part-*

      - name: Upload ISO part 00
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NexusOS-ISO-part-00
          path: source/Nexus-OS/dist/*.iso.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload ISO part 01
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NexusOS-ISO-part-01
          path: source/Nexus-OS/dist/*.iso.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload ISO part 02
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NexusOS-ISO-part-02
          path: source/Nexus-OS/dist/*.iso.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload ISO part 03
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NexusOS-ISO-part-03
          path: source/Nexus-OS/dist/*.iso.part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload ISO verification metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NexusOS-ISO-verification
          path: |
            source/Nexus-OS/dist/*.iso.sha256
            source/Nexus-OS/dist/*.qemu.log
          if-no-files-found: error
          retention-days: 7
