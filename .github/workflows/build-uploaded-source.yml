name: Build uploaded NexusOS ISO

on:
  push:
    branches:
      - main
    paths:
      - "Nexus-OS-Stage0-r3-local-repository.zip"
      - ".github/workflows/build-uploaded-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusos-uploaded-iso
  cancel-in-progress: true

jobs:
  build-and-boot-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install ISO build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git gettext po4a unzip cmake ninja-build g++ \
            live-build xorriso debootstrap squashfs-tools debian-archive-keyring \
            grub-pc-bin grub-efi-amd64-bin mtools \
            qemu-system-x86 ovmf

      - name: Install current official Debian live-build
        run: |
          git clone --depth 1 https://salsa.debian.org/live-team/live-build.git /tmp/current-live-build
          sudo make -C /tmp/current-live-build install
          lb --version

      - name: Extract canonical Stage 0 source
        run: |
          rm -rf source
          mkdir source
          unzip -q Nexus-OS-Stage0-r3-local-repository.zip -d source
          test -x source/Nexus-OS/scripts/build-iso.sh

      - name: Apply Debian 13 repository compatibility
        run: |
          sed -i 's/bookworm/trixie/g' source/Nexus-OS/distro/live-build/auto/config
          sed -i 's/--binary-images/--binary-image/' source/Nexus-OS/distro/live-build/auto/config
          sed -i '/--mirror-binary-security/a\  --security false \\' source/Nexus-OS/distro/live-build/auto/config
          sed -i '/--security false/a\  --apt-indices false \\' source/Nexus-OS/distro/live-build/auto/config
          sed -i '/--apt-indices false/a\  --apt-recommends false \\' source/Nexus-OS/distro/live-build/auto/config
          mkdir -p source/Nexus-OS/distro/live-build/config/archives
          printf '%s\n' 'deb http://security.debian.org/debian-security trixie-security main contrib non-free-firmware' > source/Nexus-OS/distro/live-build/config/archives/debian-security.list.chroot
          sed -i -e 's/^live-config$/live-config-systemd/' -e '/^steam-installer$/d' -e '/^gamescope$/d' source/Nexus-OS/distro/live-build/config/package-lists/nexusos.list.chroot

      - name: Validate source
        working-directory: source/Nexus-OS
        run: ./scripts/validate-release.sh

      - name: Build hybrid desktop ISO
        working-directory: source/Nexus-OS
        run: |
          status=0
          sudo ./scripts/build-iso.sh desktop || status=$?
          generated=$(sudo find distro/live-build/.build/desktop -maxdepth 1 -name '*.iso' -print -quit)
          if [[ -n "$generated" ]]; then
            version=$(tr -d '[:space:]' < VERSION)
            output=dist/NexusOS-${version}-desktop-amd64.iso
            volume=$(printf 'NEXUSOS_%s' "$version" | tr '[:lower:].-' '[:upper:]__' | tr -cd '[:alnum:]_' | cut -c1-32)
            sudo cp "$generated" "$output"
            sudo chown -R "$(id -u):$(id -g)" dist
            sha256sum "$output" > "$output.sha256"
            ./scripts/inspect-iso.sh "$output" "$volume"
            status=0
          fi
          echo "generated ISO: $generated"
          echo "build-iso status: $status"
          exit "$status"

      - name: Verify checksum
        working-directory: source/Nexus-OS
        run: sha256sum -c dist/*.iso.sha256

      - name: Verify BIOS boot
        working-directory: source/Nexus-OS
        run: sudo env NEXUS_QEMU_TIMEOUT=240 ./scripts/test-iso-qemu.sh dist/*.iso bios

      - name: Verify UEFI boot
        working-directory: source/Nexus-OS
        run: sudo env NEXUS_QEMU_TIMEOUT=240 ./scripts/test-iso-qemu.sh dist/*.iso uefi

      - name: Upload Rufus-ready ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NexusOS-Rufus-ready-desktop-amd64
          path: |
            source/Nexus-OS/dist/*.iso
            source/Nexus-OS/dist/*.iso.sha256
            source/Nexus-OS/dist/*.qemu.log
          if-no-files-found: error
          retention-days: 7
